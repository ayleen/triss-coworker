name: Inspect 0.44.6 release inputs
on:
  push:
    branches: [release/0.44.6-security]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global npm@11.6.2
      - name: Record artifact integrity
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" ./packages/dsh-provider-bundle
          sha256sum "$RUNNER_TEMP/triss-dsh-provider-bundle-0.44.6.tgz"
          npm view @deepseek-ai/dsh@0.1.0-rc.6 dist --json
      - name: Audit both lockfiles
        run: |
          status=0
          npm audit --package-lock-only || status=1
          (cd site && npm audit --package-lock-only) || status=1
          exit "$status"
