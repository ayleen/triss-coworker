name: Apply PR 32 cross-review fixes

on:
  push:
    branches:
      - 'docs/usage-accounting-v2-plan'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/usage-accounting-v2-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/fix-pr32-05.py')
          text = path.read_text()
          text = text.replace("+ '\\nDisable tracking: TRISS_USAGE_LOG=0'", "+ '\\\\nDisable tracking: TRISS_USAGE_LOG=0'")
          text = text.replace("  let input = '';", "  let input;")
          text = text.replace("  let output = '';", "  let output;")
          path.write_text(text)

          path = Path('.github/fix-pr32-06.py')
          text = path.read_text()
          start_marker = "replace_once(\n    'docs/usage-accounting.md',\n    \"\"\"Records without `schema_version`"
          next_marker = "replace_once(\n    'docs/usage-accounting.md',\n    \"\"\"At least one numeric field"
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          cat .github/fix-pr32-0*.py > /tmp/fix-pr32-review.py
          python /tmp/fix-pr32-review.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/usage-accounting.md')
          text = path.read_text()
          pattern = (
              r'Records without `schema_version` are read as-is; the log is never rewritten\s+'
              r'in\s+place\.'
          )
          replacement = (
              'Records without `schema_version` are read as-is; the log is never rewritten in\n'
              'place. Only an absent version denotes v1. A record with an unknown explicit\n'
              'version is excluded from deprecated-alias interpretation and reported as an\n'
              'unsupported record instead of being silently downgraded.'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'expected one legacy-schema documentation match, found {count}')
          path.write_text(text)
          PY
      - run: npm run lint
      - run: npm test
      - name: Commit fixes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/fix-pr32-0*.py .github/workflows/fix-pr32-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(usage): address cross-review accounting gaps'
          git push origin HEAD:docs/usage-accounting-v2-plan
