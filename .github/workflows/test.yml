name: Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NPM_VERSION: '11.6.2'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
      fail-fast: false
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - run: npm run check

  omp-contract:
    runs-on: ubuntu-latest
    name: OMP 18.0.6 contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Install pinned OMP contract binary
        run: npm install --global "@oh-my-pi/pi-coding-agent@18.0.6"
      - name: Verify real OMP contract
        run: |
          OMP_BIN="$(command -v omp)"
          test -n "$OMP_BIN"
          VERSION="$(omp --version)"
          test "$VERSION" = "18.0.6" || test "$VERSION" = "omp/18.0.6"
          OMP_BIN="$OMP_BIN" node --test test/coder-omp-contract.test.js

  # The bundle matrix and real-Harness lifecycle job are reusable so pull
  # requests and tag publication run the same checks.
  bundle-checks:
    uses: ./.github/workflows/bundle-checks.yml

  pnpm-install:
    runs-on: ubuntu-latest
    name: pnpm install (consumer smoke test)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Pack tarball
        run: |
          mkdir -p /tmp/triss-pack
          npm pack --pack-destination /tmp/triss-pack
      - name: Install tarball with pnpm in a fresh project
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          mkdir /tmp/consumer
          cd /tmp/consumer
          pnpm init
          TARBALL=$(ls /tmp/triss-pack/triss-coworker-*.tgz)
          pnpm add "$TARBALL"
          ./node_modules/.bin/triss --version

  standalone-build:
    needs: test
    runs-on: ubuntu-latest
    name: build canonical standalone artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Build twice from independent production installs
        run: |
          node scripts/release-gates.js build-twice \
            --source "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/triss-standalone" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --version "$(node -p "require('./package.json').version")"
      - name: Record canonical artifact checksum
        run: |
          node scripts/release-gates.js write-checksum \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Verify canonical artifact input
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-canonical
          path: |
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz.metadata.json
            ${{ runner.temp }}/triss-standalone/standalone.sha256
          if-no-files-found: error

  standalone-smoke:
    needs: standalone-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
      fail-fast: false
    name: standalone smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-canonical
          path: ${{ runner.temp }}/triss-standalone
      - name: Verify downloaded artifact digest
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Smoke downloaded artifact without package or repository tools
        run: |
          node scripts/release-gates.js smoke \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz"
