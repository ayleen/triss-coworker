name: Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NPM_VERSION: '11.6.2'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
      fail-fast: false
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  bundle-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24', '26']
      fail-fast: false
    name: bundle matrix (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Bundle package, resolution, and settings matrices
        run: |
          node --test test/dsh-provider-bundle.test.js \
            test/dsh-provider-bundle-resolution.test.js \
            test/dsh-provider-bundle-settings.test.js \
            test/dsh-publish-gate.test.js
      - name: Companion engine range must match the manifest exactly
        run: |
          ENGINE=$(node -p "require('./packages/dsh-provider-bundle/package.json').engines.node")
          if [ "$ENGINE" != "^22.19.0 || >=24.0.0" ]; then
            echo "unexpected companion engines.node: $ENGINE"
            exit 1
          fi
      - name: pnpm-missing diagnostics surface without pnpm on PATH
        run: |
          node --test --test-reporter=tap test/dsh-provider-bundle-resolution.test.js 2>&1 | tee /tmp/resolution.log
          grep -q "# SKIP pnpm is not on PATH" /tmp/resolution.log
          echo "pnpm-missing skip diagnostic confirmed without corepack pnpm activation"

  pnpm-install:
    runs-on: ubuntu-latest
    name: pnpm install (consumer smoke test)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Pack tarball
        run: |
          mkdir -p /tmp/triss-pack
          npm pack --pack-destination /tmp/triss-pack
      - name: Install tarball with pnpm in a fresh project
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          mkdir /tmp/consumer
          cd /tmp/consumer
          pnpm init
          TARBALL=$(ls /tmp/triss-pack/triss-coworker-*.tgz)
          pnpm add "$TARBALL"
          ./node_modules/.bin/triss --version

  standalone-build:
    needs: test
    runs-on: ubuntu-latest
    name: build canonical standalone artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Build twice from independent production installs
        run: |
          node scripts/release-gates.js build-twice \
            --source "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/triss-standalone" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --version "$(node -p "require('./package.json').version")"
      - name: Record canonical artifact checksum
        run: |
          node scripts/release-gates.js write-checksum \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Verify canonical artifact input
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-canonical
          path: |
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz.metadata.json
            ${{ runner.temp }}/triss-standalone/standalone.sha256
          if-no-files-found: error

  standalone-smoke:
    needs: standalone-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
      fail-fast: false
    name: standalone smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: standalone-canonical
          path: ${{ runner.temp }}/triss-standalone
      - name: Verify downloaded artifact digest
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Smoke downloaded artifact without package or repository tools
        run: |
          node scripts/release-gates.js smoke \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz"
