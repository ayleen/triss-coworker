name: Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NPM_VERSION: '11.6.2'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
      fail-fast: false
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  bundle-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24', '26']
      fail-fast: false
    name: bundle matrix (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Bundle package, resolution, and settings matrices
        run: |
          node --test test/dsh-provider-bundle.test.js \
            test/dsh-provider-bundle-resolution.test.js \
            test/dsh-provider-bundle-settings.test.js \
            test/dsh-publish-gate.test.js
      - name: Companion engine range must match the manifest exactly
        run: |
          ENGINE=$(node -p "require('./packages/dsh-provider-bundle/package.json').engines.node")
          if [ "$ENGINE" != "^22.19.0 || >=24.0.0" ]; then
            echo "unexpected companion engines.node: $ENGINE"
            exit 1
          fi
      - name: pnpm-missing diagnostics surface without pnpm on PATH
        run: |
          node --test --test-reporter=tap test/dsh-provider-bundle-resolution.test.js 2>&1 | tee /tmp/resolution.log
          grep -q "# SKIP pnpm is not on PATH" /tmp/resolution.log
          echo "pnpm-missing skip diagnostic confirmed without corepack pnpm activation"

  pnpm-install:
    runs-on: ubuntu-latest
    name: pnpm install (consumer smoke test)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Pack tarball
        run: |
          mkdir -p /tmp/triss-pack
          npm pack --pack-destination /tmp/triss-pack
      - name: Install tarball with pnpm in a fresh project
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          mkdir /tmp/consumer
          cd /tmp/consumer
          pnpm init
          TARBALL=$(ls /tmp/triss-pack/triss-coworker-*.tgz)
          pnpm add "$TARBALL"
          ./node_modules/.bin/triss --version

  dsh-plugin-lifecycle:
    runs-on: ubuntu-latest
    name: dsh plugin lifecycle (real Harness + pnpm)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Activate pinned pnpm on PATH
        run: |
          # The repo pins packageManager=npm, so corepack strict mode refuses
          # to activate pnpm here ("This project is configured to use npm").
          # Non-strict activation is the supported workaround and only
          # affects this job's PATH.
          export COREPACK_ENABLE_STRICT=0
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version
      - name: Install the pinned real Harness CLI
        run: |
          npm install --global @deepseek-ai/dsh@0.1.0-rc.6
          dsh --version
      - name: Pack the companion and a v2 fixture with a different effective patch
        run: |
          mkdir -p /tmp/lifecycle/pack /tmp/lifecycle/fixture
          npm pack --ignore-scripts --pack-destination /tmp/lifecycle/pack packages/dsh-provider-bundle
          cp -r packages/dsh-provider-bundle/* /tmp/lifecycle/fixture/
          node <<'EOF'
          const fs = require('fs');
          const manifest = '/tmp/lifecycle/fixture/package.json';
          const m = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          m.version = `${m.version}-lifecycle.2`;
          fs.writeFileSync(manifest, JSON.stringify(m, null, 2) + '\n');
          const patch = '/tmp/lifecycle/fixture/cordis.patch.yml';
          const yaml = fs.readFileSync(patch, 'utf8');
          const anchor = '      zai:\n        apiKeyEnv: ZAI_API_KEY\n';
          if (!yaml.includes(anchor)) throw new Error('zai provider anchor not found');
          // The marker must be a real YAML node inside llm-pi-ai.config.providers:
          // dump-config renders provider keys (verified live on dsh 0.1.0-rc.6)
          // but drops YAML comments and unknown top-level entries.
          fs.writeFileSync(patch, yaml.replace(
            anchor,
            `${anchor}      lifecycle-marker-v2:\n        apiKeyEnv: LIFECYCLE_MARKER_V2\n`,
          ));
          EOF
          (cd /tmp/lifecycle/fixture && npm pack --ignore-scripts --pack-destination /tmp/lifecycle/pack)
          ls /tmp/lifecycle/pack
      - name: add → dump-config proves the three routes
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          V1=$(ls /tmp/lifecycle/pack/triss-dsh-provider-bundle-*.tgz | grep -v lifecycle)
          dsh plugin --profile headless add -w "$V1"
          dsh --profile headless --dump-config > /tmp/lifecycle/dump-v1.yml
          for route in opencode opencode-go zai; do
            grep -q "$route" /tmp/lifecycle/dump-v1.yml || { echo "route $route missing after add"; exit 1; }
          done
          grep -q "OPENCODE_API_KEY" /tmp/lifecycle/dump-v1.yml
          grep -q "ZAI_API_KEY" /tmp/lifecycle/dump-v1.yml
      - name: update (remove + add v2) → effective patch actually changes
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          V2=$(ls /tmp/lifecycle/pack/triss-dsh-provider-bundle-*lifecycle*.tgz)
          # dsh plugin add forwards to pnpm add, which is a no-op when the
          # package name is already installed. The supported Harness update
          # path is remove + add, verified live on dsh 0.1.0-rc.6: adding the
          # v2 tarball over v1 leaves the v1 patch active.
          dsh plugin --profile headless remove triss-dsh-provider-bundle
          dsh plugin --profile headless add -w "$V2"
          dsh --profile headless --dump-config > /tmp/lifecycle/dump-v2.yml
          grep -q "LIFECYCLE_MARKER_V2" /tmp/lifecycle/dump-v2.yml || {
            echo "effective patch did not change after update"; exit 1;
          }
          # The v2 patch REPLACES v1: the original three routes must still be
          # intact alongside the marker (composition, not accumulation).
          grep -q "ZAI_API_KEY" /tmp/lifecycle/dump-v2.yml
      - name: remove → dependency and bundle entry gone, dormant posture
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile headless remove triss-dsh-provider-bundle
          dsh --profile headless --dump-config > /tmp/lifecycle/dump-removed.yml
          if grep -q "triss-dsh-provider-bundle" /tmp/lifecycle/dump-removed.yml; then
            echo "companion still referenced after remove"; exit 1
          fi
          if grep -q "apiKeyEnv: OPENCODE_API_KEY" /tmp/lifecycle/dump-removed.yml; then
            echo "routes still active after remove"; exit 1
          fi
      - name: reinstall → composition restored
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          V1=$(ls /tmp/lifecycle/pack/triss-dsh-provider-bundle-*.tgz | grep -v lifecycle)
          dsh plugin --profile headless add -w "$V1"
          dsh --profile headless --dump-config > /tmp/lifecycle/dump-reinstalled.yml
          for route in opencode opencode-go zai; do
            grep -q "$route" /tmp/lifecycle/dump-reinstalled.yml || { echo "route $route missing after reinstall"; exit 1; }
          done
      - name: Repeat add+dump through an npx-style Harness anchor
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-npx-home"
          V1=$(ls /tmp/lifecycle/pack/triss-dsh-provider-bundle-*.tgz | grep -v lifecycle)
          npx --yes --package @deepseek-ai/dsh@0.1.0-rc.6 dsh plugin --profile headless add -w "$V1"
          npx --yes --package @deepseek-ai/dsh@0.1.0-rc.6 dsh --profile headless --dump-config > /tmp/lifecycle/dump-npx.yml
          for route in opencode opencode-go zai; do
            grep -q "$route" /tmp/lifecycle/dump-npx.yml || { echo "route $route missing via npx anchor"; exit 1; }
          done

  standalone-build:
    needs: test
    runs-on: ubuntu-latest
    name: build canonical standalone artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Build twice from independent production installs
        run: |
          node scripts/release-gates.js build-twice \
            --source "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/triss-standalone" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --version "$(node -p "require('./package.json').version")"
      - name: Record canonical artifact checksum
        run: |
          node scripts/release-gates.js write-checksum \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Verify canonical artifact input
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-canonical
          path: |
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz.metadata.json
            ${{ runner.temp }}/triss-standalone/standalone.sha256
          if-no-files-found: error

  standalone-smoke:
    needs: standalone-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
      fail-fast: false
    name: standalone smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: standalone-canonical
          path: ${{ runner.temp }}/triss-standalone
      - name: Verify downloaded artifact digest
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Smoke downloaded artifact without package or repository tools
        run: |
          node scripts/release-gates.js smoke \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz"
