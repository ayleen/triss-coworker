name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/website/**'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/website/**'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install npm 11.6.2
        run: npm install --global npm@11.6.2 && npm --version
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Astro check
        working-directory: site
        run: npx astro check
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build
        working-directory: site
        run: npm run build
      - name: Link check
        working-directory: site
        run: |
          node -e "
          import fs from 'node:fs';
          import path from 'node:path';
          const dist='dist';
          const htmlFiles=[...fs.readdirSync(dist,{recursive:true})].filter(f=>f.endsWith('.html'));
          console.log('built',htmlFiles.length,'pages');
          if(!fs.existsSync(dist+'/sitemap-index.xml')){console.error('missing sitemap');process.exit(1)}
          if(!fs.existsSync(dist+'/robots.txt')){console.error('missing robots');process.exit(1)}
          // Check internal hrefs point to existing files
          let broken=0;
          for(const f of htmlFiles){
            const html=fs.readFileSync(path.join(dist,f),'utf8');
            const hrefs=[...html.matchAll(/href=\"(\\/[^\"#?]*)/g)].map(m=>m[1]);
            for(const href of hrefs){
              if(href.startsWith('/_astro')||href.startsWith('/favicon')||href.startsWith('/triss')||href.startsWith('/apple')||href.startsWith('/icon')||href.startsWith('/og-image')||href.startsWith('/site.webmanifest')) continue;
              const target=href==='/'?'index.html':href.replace(/^\\//,'')+'/index.html';
              const alt=href.replace(/^\\//,'');
              if(!fs.existsSync(path.join(dist,target)) && !fs.existsSync(path.join(dist,alt)) && !fs.existsSync(path.join(dist,href.replace(/^\\//,''))))){
                console.error('broken link',href,'in',f);
                broken++;
              }
            }
          }
          if(broken>0){console.error(broken,'broken links');process.exit(1)}
          console.log('link check passed');
          "
      - name: Tests
        working-directory: site
        run: npm test
      - name: Upload dist
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
