name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/website/**'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/website/**'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install npm 11.6.2
        run: npm install --global npm@11.6.2 && npm --version
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Astro check
        working-directory: site
        run: npx astro check
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build
        working-directory: site
        run: npm run build
      - name: Link check
        working-directory: site
        run: node scripts/check-links.mjs
      - name: Tests
        working-directory: site
        run: npm test
      - name: Upload dist
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: site/dist
