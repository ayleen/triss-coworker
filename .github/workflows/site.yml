name: Site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'src/usage.js'
      - 'docs/website/**'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/usage.js'
      - 'docs/website/**'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, accessibility, browser, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install npm 11.6.2
        run: npm install --global npm@11.6.2 && npm --version
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Dependency audit
        working-directory: site
        env:
          NPM_CONFIG_FETCH_RETRIES: 1
          NPM_CONFIG_FETCH_TIMEOUT: 60000
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/site-npm-audit-$attempt.log"
            if npm run audit:dependencies 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eq 'audit endpoint returned an error|network timeout|503 Service Unavailable' "$log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Astro check
        working-directory: site
        run: npm run check
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Build
        working-directory: site
        run: npm run build
      - name: Cloudflare deployment dry run
        working-directory: site
        run: npm run cloudflare:check
      - name: Link check
        working-directory: site
        run: node scripts/check-links.mjs
      - name: Tests
        working-directory: site
        run: npm test
      - name: Browser and WCAG acceptance
        working-directory: site
        run: npm run test:browser
      - name: Lighthouse budgets
        working-directory: site
        run: npm run test:lighthouse
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-quality-evidence
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            site/dist
            site/playwright-report
            site/test-results
            site/.lighthouse
