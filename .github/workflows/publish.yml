name: Publish to npm

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NPM_VERSION: '11.6.2'

concurrency:
  group: triss-release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
      fail-fast: false
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - run: npm run check

  # Tag pushes must run the same bundle matrix and real-harness lifecycle
  # checks as PR CI; test.yml does not run for tags.
  bundle-checks:
    uses: ./.github/workflows/bundle-checks.yml

  standalone-build:
    needs: test
    runs-on: ubuntu-latest
    name: build canonical standalone artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm used for dependency installation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Build canonical artifact from independent production installs
        run: |
          node scripts/release-gates.js build-twice \
            --source "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/triss-standalone" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --version "${GITHUB_REF_NAME#v}"
      - name: Record canonical artifact checksum
        run: |
          node scripts/release-gates.js write-checksum \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --output "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Verify canonical artifact input
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-canonical
          path: |
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz
            ${{ runner.temp }}/triss-standalone/standalone.ndjson.gz.metadata.json
            ${{ runner.temp }}/triss-standalone/standalone.sha256
          if-no-files-found: error

  standalone-smoke:
    needs: standalone-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
      fail-fast: false
    name: standalone smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-canonical
          path: ${{ runner.temp }}/triss-standalone
      - name: Verify downloaded artifact digest
        run: |
          node scripts/release-gates.js verify-artifact \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz" \
            --metadata "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz.metadata.json" \
            --checksum "$RUNNER_TEMP/triss-standalone/standalone.sha256"
      - name: Smoke downloaded artifact without package or repository tools
        run: |
          node scripts/release-gates.js smoke \
            --artifact "$RUNNER_TEMP/triss-standalone/standalone.ndjson.gz"

  # All tag-controlled verification runs without id-token access. The
  # privileged publish job receives only this verdict and verified artifacts.
  # The publish job below only receives its verdict and artifacts.
  release-gates:
    needs: [test, bundle-checks, standalone-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_companion: ${{ steps.plan.outputs.publish_companion }}
      publish_root: ${{ steps.plan.outputs.publish_root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm used for packing
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - name: Verify root npm package contents and consumer lifecycle
        run: npm run check:package
      - name: Verify tag matches both package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          COMPANION_VERSION=$(node -p "require('./packages/dsh-provider-bundle/package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ] || [ "$COMPANION_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json $PKG_VERSION / companion $COMPANION_VERSION"
            exit 1
          fi
          node scripts/publish-gate.js verify-versions --tag "$GITHUB_REF_NAME"
      - name: Inspect both packed tarballs before publishing
        run: |
          # The pipeline below starts node and tee concurrently; tee opens its
          # output BEFORE node's internal mkdirSync() can run, so the
          # directory must exist before the pipeline starts.
          mkdir -p "$RUNNER_TEMP/publish-pack"
          node scripts/publish-gate.js pack-inspect --workdir "$RUNNER_TEMP/publish-pack" \
            | tee "$RUNNER_TEMP/publish-pack/local-manifest.json"
      - name: Plan publication from live registry state (safe retry)
        id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/publish-pack"
          node scripts/publish-gate.js plan-publish \
            --local-manifest "$RUNNER_TEMP/publish-pack/local-manifest.json" \
            | tee "$RUNNER_TEMP/publish-pack/publish-plan.json"
          node -e '
            const fs = require("fs");
            const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const out = plan.actions || {};
            const line = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
            line("publish_companion", String(out.publishCompanion === true));
            line("publish_root", String(out.publishRoot === true));
          ' "$RUNNER_TEMP/publish-pack/publish-plan.json"
      - name: Authorize the tag against origin/main (fresh release or safe retry)
        run: |
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          TAG_SHA=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          MAIN_SHA=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          EXACT=0
          ANCESTOR=0
          if [ "$TAG_SHA" = "$MAIN_SHA" ]; then EXACT=1; fi
          if git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then ANCESTOR=1; fi
          node scripts/publish-gate.js authorize-tag \
            --plan "$RUNNER_TEMP/publish-pack/publish-plan.json" \
            --exact-main "$EXACT" --ancestor-main "$ANCESTOR" \
            | tee "$RUNNER_TEMP/publish-pack/authorization.json"
          MODE=$(node -p "require('$RUNNER_TEMP/publish-pack/authorization.json').mode")
          echo "release authorization mode: $MODE (exact=$EXACT ancestor=$ANCESTOR)"
          # install.sh drift against a moved main is only meaningful when
          # nothing has been published yet; in retry mode main has advanced
          # past the tag by design.
          if [ "$MODE" != "fresh" ]; then exit 0; fi
          git show "${GITHUB_REF_NAME}:install.sh" > "$RUNNER_TEMP/tag-install.sh"
          git show 'refs/remotes/origin/main:install.sh' > "$RUNNER_TEMP/main-install.sh"
          cmp -s "$RUNNER_TEMP/tag-install.sh" "$RUNNER_TEMP/main-install.sh" || {
            echo "Tagged install.sh does not match origin/main"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: |
            ${{ runner.temp }}/publish-pack/local-manifest.json
            ${{ runner.temp }}/publish-pack/publish-plan.json
            ${{ runner.temp }}/publish-pack/*.tgz
          if-no-files-found: error

  # This is the only job with id-token: write. It is protected by the
  # npm-production environment and runs no
  # repository scripts — the byte check uses plain `npm pack
  # --ignore-scripts` plus sha256sum, and publication itself skips lifecycle
  # hooks — and it publishes the same bytes the release-gates job verified
  # after a deterministic repack comparison.
  npm-publish:
    needs: [release-gates]
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Pin npm used for publication
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tarballs
          path: publish-pack
      - name: Repack and byte-verify both tarballs against the gates artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify-pack"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/verify-pack" ./packages/dsh-provider-bundle >/dev/null
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/verify-pack" . >/dev/null
          # NOTE the unquoted glob below: a quoted "${name}-*.tgz" is passed
          # to ls LITERALLY (no expansion) — the first two v0.35.0 attempts
          # failed exactly here while `ls -la` in the same step showed both
          # files. RUNNER_TEMP and the names carry no spaces, so the unquoted
          # glob is safe.
          for name in triss-dsh-provider-bundle triss-coworker; do
            GATES=$(ls publish-pack/${name}-*.tgz)
            VERIFY=$(ls $RUNNER_TEMP/verify-pack/${name}-*.tgz)
            GATES_SHA=$(sha256sum "$GATES" | cut -d' ' -f1)
            VERIFY_SHA=$(sha256sum "$VERIFY" | cut -d' ' -f1)
            if [ "$GATES_SHA" != "$VERIFY_SHA" ]; then
              echo "refusing to publish $name: repacked sha256 $VERIFY_SHA != gates sha256 $GATES_SHA"
              exit 1
            fi
            echo "$name bytes verified: $GATES_SHA"
          done
      - name: Publish companion package triss-dsh-provider-bundle (skipped when already published with identical bytes)
        if: needs.release-gates.outputs.publish_companion == 'true'
        working-directory: packages/dsh-provider-bundle
        run: npm publish --access public --provenance --ignore-scripts
      - name: Publish root package triss-coworker (skipped when already published with identical bytes)
        if: needs.release-gates.outputs.publish_root == 'true'
        run: npm publish --access public --provenance --ignore-scripts

  registry-acceptance:
    # Plan step 16, automatable half: install the REGISTRY package (not a
    # local tarball) into fresh profiles, prove the plugin lifecycle with
    # parsed route assertions, verify both published packages byte-for-byte,
    # and record the compatibility + integrity evidence. Live provider-model
    # smokes stay credential-bound acceptance evidence outside CI.
    needs: npm-publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
      fail-fast: false
    name: registry acceptance (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Pin npm
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Activate pinned pnpm on PATH
        run: |
          # The repo pins packageManager=npm, so corepack strict mode refuses
          # to activate pnpm here ("This project is configured to use npm").
          export COREPACK_ENABLE_STRICT=0
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version
      - name: Install the pinned real Harness CLI
        run: |
          npm install --global @deepseek-ai/dsh@0.1.0-rc.6
          dsh --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tarballs
          path: publish-pack
      - name: Registry-verify BOTH published packages against the gates artifact
        run: |
          node scripts/publish-gate.js plan-publish \
            --local-manifest publish-pack/local-manifest.json \
            > "$RUNNER_TEMP/final-verify.json"
          node -e '
            const fs = require("fs");
            const verify = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const key of ["companion", "root"]) {
              const entry = verify[key];
              if (!entry || entry.published !== true || entry.integrityOk !== true) {
                console.error(`post-publish verification failed for ${key}:`, entry);
                process.exit(1);
              }
            }
            console.log("post-publish registry verification passed for both packages");
          ' "$RUNNER_TEMP/final-verify.json"
      - name: Registry update path (runs whenever a previous version exists)
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          PREV=$(npm view triss-dsh-provider-bundle versions --json | node -e '
            let data = "";
            process.stdin.on("data", (c) => { data += c; });
            process.stdin.on("end", () => {
              const cmp = (a, b) => {
                const pa = a.split(".").map(Number);
                const pb = b.split(".").map(Number);
                for (let i = 0; i < 3; i += 1) {
                  if (pa[i] !== pb[i]) { process.stdout.write(""); return pa[i] < pb[i] ? -1 : 1; }
                }
                return 0;
              };
              // NB: with `node -e` the positional arg lands in argv[1];
              // argv[2] is undefined here and crashed the first run.
              const target = process.argv[process.argv.length - 1];
              const stable = JSON.parse(data).filter((v) => /^\d+\.\d+\.\d+$/.test(v) && cmp(v, target) < 0);
              stable.sort(cmp);
              process.stdout.write(stable[stable.length - 1] ?? "");
            });' "$VERSION")
          if [ -z "$PREV" ]; then
            # First release of the companion: no previous registry version
            # can exist. Update mechanics are guaranteed by the lifecycle
            # job's in-place v1→v2 proof (contract amendment recorded in the
            # plan document).
            echo "no previous registry version — registry update deferred to the lifecycle job proof"
            exit 0
          fi
          export DSH_HOME="$RUNNER_TEMP/dsh-home-update"
          dsh plugin --profile headless add -w "triss-dsh-provider-bundle@${PREV}"
          dsh plugin --profile headless add -w "triss-dsh-provider-bundle@${VERSION}"
          dsh --profile headless --dump-config > "$RUNNER_TEMP/dump-updated.yml"
          node scripts/dsh-dump-assert.js present "$RUNNER_TEMP/dump-updated.yml"
          node - "$DSH_HOME/profiles/headless/package.json" "$VERSION" <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const [manifestPath, version] = process.argv.slice(2);
          const installed = JSON.parse(fs.readFileSync(
            path.join(path.dirname(manifestPath), 'node_modules', 'triss-dsh-provider-bundle', 'package.json'),
            'utf8',
          ));
          if (installed.version !== version) {
            throw new Error(`registry update left ${installed.version} installed, expected ${version}`);
          }
          EOF
      - name: add → registry install activates the three routes at the exact released version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile headless add -w "triss-dsh-provider-bundle@${VERSION}"
          dsh --profile headless --dump-config > "$RUNNER_TEMP/dump-added.yml"
          node scripts/dsh-dump-assert.js present "$RUNNER_TEMP/dump-added.yml"
          node - "$DSH_HOME/profiles/headless/package.json" "$VERSION" <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const [manifestPath, version] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const dep = manifest.dependencies?.['triss-dsh-provider-bundle'];
          if (typeof dep !== 'string' || dep.length === 0) {
            throw new Error('profile manifest carries no companion dependency after registry add');
          }
          if (!manifest.dsh?.profile?.bundles?.includes('triss-dsh-provider-bundle')) {
            throw new Error('companion missing from dsh.profile.bundles after registry add');
          }
          const installed = JSON.parse(fs.readFileSync(
            path.join(path.dirname(manifestPath), 'node_modules', 'triss-dsh-provider-bundle', 'package.json'),
            'utf8',
          ));
          if (installed.version !== version) {
            throw new Error(`registry installed ${installed.version}, expected the exact released ${version}`);
          }
          EOF
      - name: remove → registry package uninstalls cleanly, reinstall restores it
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile headless remove triss-dsh-provider-bundle
          dsh --profile headless --dump-config > "$RUNNER_TEMP/dump-removed.yml"
          node scripts/dsh-dump-assert.js absent "$RUNNER_TEMP/dump-removed.yml"
          node - "$DSH_HOME/profiles/headless/package.json" <<'EOF'
          const manifest = JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8'));
          if (manifest.dependencies?.['triss-dsh-provider-bundle'] !== undefined) {
            throw new Error('dependency still present after registry remove');
          }
          if ((manifest.dsh?.profile?.bundles ?? []).includes('triss-dsh-provider-bundle')) {
            throw new Error('dsh.profile.bundles still lists the companion after registry remove');
          }
          EOF
          dsh plugin --profile headless add -w "triss-dsh-provider-bundle@${VERSION}"
          dsh --profile headless --dump-config > "$RUNNER_TEMP/dump-reinstalled.yml"
          node scripts/dsh-dump-assert.js present "$RUNNER_TEMP/dump-reinstalled.yml"
      - name: Record acceptance evidence tuple and provenance (fail-closed)
        env:
          TAG_VERSION: ${{ github.ref_name }}
          NODE_MAJOR: ${{ matrix.node }}
          # The repo pins packageManager=npm; corepack strict mode would
          # refuse the direct pnpm calls below ("This project is configured
          # to use npm") exactly like it does in the lifecycle job.
          COREPACK_ENABLE_STRICT: '0'
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          PROFILE="$DSH_HOME/profiles/headless"
          # Profile dependency graph evidence: pnpm list output is saved and
          # the companion must appear in it (the adapters resolve from the
          # dsh installation, which is why their versions come from there —
          # verified live; recorded in the plan document).
          pnpm --dir "$PROFILE" list --depth Infinity --json > "$RUNNER_TEMP/pnpm-list.json"
          cp "$PROFILE/pnpm-lock.yaml" "$RUNNER_TEMP/pnpm-lock.yaml"
          node - "$PROFILE" > "$RUNNER_TEMP/registry-acceptance-node${NODE_MAJOR}.json" <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const run = (cmd) => {
            const value = execSync(cmd, { encoding: 'utf8' }).trim();
            if (!value) throw new Error(`command produced no output: ${cmd}`);
            return value;
          };
          const required = (label, value) => {
            if (value === null || value === undefined || value === '') {
              throw new Error(`compatibility tuple is incomplete: ${label} is missing`);
            }
            return value;
          };
          (async () => {
            const [profileDir] = process.argv.slice(2);
            const version = required('tag version', process.env.TAG_VERSION).replace(/^v/, '');
            const temp = process.env.RUNNER_TEMP;

            // Companion from the profile itself.
            const installed = JSON.parse(fs.readFileSync(
              path.join(profileDir, 'node_modules', 'triss-dsh-provider-bundle', 'package.json'), 'utf8',
            ));
            if (installed.version !== version) {
              throw new Error(`profile holds companion ${installed.version}, expected ${version}`);
            }
            const pnpmList = JSON.parse(fs.readFileSync(path.join(temp, 'pnpm-list.json'), 'utf8'));
            const listed = JSON.stringify(pnpmList);
            if (!listed.includes('triss-dsh-provider-bundle')) {
              throw new Error('companion missing from the profile pnpm list');
            }

            // Companion integrity from the profile lockfile.
            const lock = fs.readFileSync(path.join(temp, 'pnpm-lock.yaml'), 'utf8');
            const lockMatch = /triss-dsh-provider-bundle@[^\s'"]*:\s*\n\s*resolution:\s*\{[^}]*integrity:\s*(sha512-[A-Za-z0-9+/=]+)/.exec(lock);
            const companionLockIntegrity = required(
              'companion integrity in the profile lockfile',
              lockMatch?.[1],
            );

            // Adapters resolve from the running dsh installation (verified
            // live: the profile carries only the companion and the template
            // bundles). Their versions are mandatory, not best-effort. The
            // packages may sit flat in the global root OR nested inside the
            // dsh package (observed on Actions runners) — try both.
            const globalRoot = run('npm root -g');
            const dshDir = path.join(globalRoot, '@deepseek-ai', 'dsh');
            const globalVersion = (name) => {
              for (const base of [globalRoot, path.join(dshDir, 'node_modules')]) {
                try {
                  return JSON.parse(fs.readFileSync(path.join(base, name, 'package.json'), 'utf8')).version;
                } catch { /* try the next base */ }
              }
              return null;
            };
            const dshLlmPiAi = required('dsh-llm-pi-ai (dsh installation)', globalVersion('@deepseek-ai/dsh-llm-pi-ai'));
            const piAiVersion = required('pi-ai (dsh installation)', globalVersion(path.join('@earendil-works', 'pi-ai')));
            const piAiIntegrity = required(
              'pi-ai registry integrity for the resolved version',
              JSON.parse(run(`npm view @earendil-works/pi-ai@${piAiVersion} dist.integrity --json`)),
            );

            // Registry metadata: dist.integrity AND dist.attestations — npm
            // stores attestations inside dist, where pacote reads and verifies
            // the bundles. Checking another field would silently skip provenance.
            const response = await fetch('https://registry.npmjs.org/triss-dsh-provider-bundle');
            const packument = await response.json();
            const published = packument.versions?.[version];
            if (!published) throw new Error(`registry packument carries no version ${version}`);
            const distIntegrity = required('registry dist.integrity', published.dist?.integrity);
            const attestations = published.dist?.attestations ?? null;
            if (!attestations?.provenance || !attestations.url) {
              throw new Error('published version carries no provenance attestation in dist.attestations — published without --provenance?');
            }

            const evidence = {
              node: process.version,
              npm: run('npm --version'),
              pnpm: run('pnpm --version'),
              dsh: run('dsh --version'),
              dshLlmPiAi,
              piAi: { version: piAiVersion, registryIntegrity: piAiIntegrity },
              companion: {
                version: installed.version,
                profileLockIntegrity: companionLockIntegrity,
                registryIntegrity: distIntegrity,
              },
              provenance: { url: attestations.url },
              tag: process.env.TAG_VERSION,
              sha: process.env.GITHUB_SHA,
              workflow: process.env.GITHUB_WORKFLOW_REF,
            };
            process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          EOF
          cat "$RUNNER_TEMP/registry-acceptance-node${NODE_MAJOR}.json"
      - name: Verify signatures and provenance attestations with npm audit
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          mkdir -p "$RUNNER_TEMP/audit-project"
          cd "$RUNNER_TEMP/audit-project"
          npm init -y >/dev/null
          # Saved (not --no-save): npm audit signatures works from the
          # project's lockfile, so the dependency must be recorded there.
          npm install --ignore-scripts --save-exact "triss-dsh-provider-bundle@${VERSION}" >/dev/null
          npm audit signatures --json --include-attestations > "$RUNNER_TEMP/audit-signatures.json"
          node - "$RUNNER_TEMP/audit-signatures.json" <<'EOF'
          // npm audit signatures verifies registry signatures AND provenance
          // attestations cryptographically and reports PROBLEMS: the JSON is
          // {"invalid": [...], "missing": [...]} and the command exits
          // non-zero when either is populated (shape verified against the
          // real npm 11.6.2 output). Empty lists mean every signature and
          // attestation in the lockfile verified.
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(report.invalid) || !Array.isArray(report.missing)) {
            throw new Error(`unexpected npm audit signatures output shape: ${fs.readFileSync(process.argv[2], 'utf8').slice(0, 200)}`);
          }
          if (report.invalid.length > 0 || report.missing.length > 0) {
            throw new Error(`signature/attestation problems: invalid=${JSON.stringify(report.invalid)} missing=${JSON.stringify(report.missing)}`);
          }
          console.log('npm audit signatures: all signatures and provenance attestations verified');
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-acceptance-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/registry-acceptance-node${{ matrix.node }}.json
            ${{ runner.temp }}/pnpm-list.json
            ${{ runner.temp }}/pnpm-lock.yaml
            ${{ runner.temp }}/audit-signatures.json
          if-no-files-found: error

  release:
    needs: [standalone-smoke, npm-publish, registry-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-canonical
          path: dist/canonical
      - name: Prepare checksum and release manifest
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${TAG_VERSION#v}"
          PUBLISHED_AT=$(git show -s --format=%cI "$GITHUB_SHA")
          PUBLISHED_AT=$(node -e 'const value=process.argv[1]; const parsed=Date.parse(value); if (!Number.isFinite(parsed)) process.exit(1); process.stdout.write(new Date(parsed).toISOString())' "$PUBLISHED_AT")
          node scripts/release-gates.js verify-artifact \
            --artifact dist/canonical/standalone.ndjson.gz \
            --metadata dist/canonical/standalone.ndjson.gz.metadata.json \
            --checksum dist/canonical/standalone.sha256
          mv dist/canonical/standalone.ndjson.gz "dist/triss-coworker-${RELEASE_VERSION}-standalone.ndjson.gz"
          mv dist/canonical/standalone.ndjson.gz.metadata.json "dist/triss-coworker-${RELEASE_VERSION}-standalone.ndjson.gz.metadata.json"
          node scripts/release-gates.js write-checksum \
            --artifact "dist/triss-coworker-${RELEASE_VERSION}-standalone.ndjson.gz" \
            --output "dist/triss-coworker-${RELEASE_VERSION}-standalone.sha256"
          node scripts/release-gates.js write-manifest \
            --artifact "dist/triss-coworker-${RELEASE_VERSION}-standalone.ndjson.gz" \
            --output dist/update-manifest.json \
            --artifact-name "triss-coworker-${RELEASE_VERSION}-standalone.ndjson.gz" \
            --tag "$TAG_VERSION" \
            --version "$RELEASE_VERSION" \
            --published-at "$PUBLISHED_AT"
          rm -f "dist/triss-coworker-${RELEASE_VERSION}-standalone.ndjson.gz.metadata.json"
      - name: Get or create draft GitHub Release and reconcile immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node scripts/release-gates.js ensure-release \
            --tag "$TAG_VERSION" \
            --target "$GITHUB_SHA" \
            --artifact "dist/triss-coworker-${TAG_VERSION#v}-standalone.ndjson.gz" \
            --checksum "dist/triss-coworker-${TAG_VERSION#v}-standalone.sha256" \
            --manifest dist/update-manifest.json
      - name: Verify draft assets byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node scripts/release-gates.js verify-draft \
            --resume \
            --tag "$TAG_VERSION" \
            --artifact "dist/triss-coworker-${TAG_VERSION#v}-standalone.ndjson.gz" \
            --checksum "dist/triss-coworker-${TAG_VERSION#v}-standalone.sha256" \
            --manifest dist/update-manifest.json
      - name: Publish complete release without changing latest alias
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: node scripts/release-gates.js release-action --action publish-nonlatest --tag "$TAG_VERSION" --target "$GITHUB_SHA"
      - name: Verify anonymous tag-specific assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node scripts/release-gates.js verify-tag \
            --tag "$TAG_VERSION" \
            --artifact "dist/triss-coworker-${TAG_VERSION#v}-standalone.ndjson.gz" \
            --checksum "dist/triss-coworker-${TAG_VERSION#v}-standalone.sha256" \
            --manifest dist/update-manifest.json || {
              node scripts/release-gates.js release-action --action return-to-draft --tag "$TAG_VERSION" --target "$GITHUB_SHA"
              exit 1
            }
      - name: Promote, reconcile, verify latest, and recover on failure
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-gates.js release-status \
            --tag "$TAG_VERSION" \
            > "$RUNNER_TEMP/release-status.json"
          promotion_phase=$(node -e 'const s=require(process.argv[1]); process.stdout.write(s.promotion_phase || "null")' \
            "$RUNNER_TEMP/release-status.json")
          if [ "$promotion_phase" = "incident_pending" ]; then
            recovery_status=0
            node scripts/release-gates.js recover-promotion \
              --tag "$TAG_VERSION" \
              --state "$RUNNER_TEMP/previous-latest.json" \
              --load || recovery_status=$?
            if [ "$recovery_status" -eq 0 ]; then
              recovery_status=1
            fi
            exit "$recovery_status"
          fi
          if node -e 'const s=require(process.argv[1]); process.exit(s.is_latest ? 0 : 1)' \
            "$RUNNER_TEMP/release-status.json"; then
            verify_status=0
            node scripts/release-gates.js verify-latest \
              --tag "$TAG_VERSION" \
              --artifact "dist/triss-coworker-${TAG_VERSION#v}-standalone.ndjson.gz" \
              --checksum "dist/triss-coworker-${TAG_VERSION#v}-standalone.sha256" \
              --manifest dist/update-manifest.json || verify_status=$?
            if [ "$verify_status" -eq 0 ]; then
              node scripts/release-gates.js clear-promotion-state --tag "$TAG_VERSION"
              exit 0
            fi
            recovery_status=0
            node scripts/release-gates.js recover-promotion \
              --tag "$TAG_VERSION" \
              --state "$RUNNER_TEMP/previous-latest.json" \
              --load || recovery_status=$?
            if [ "$recovery_status" -ne 0 ]; then
              exit "$recovery_status"
            fi
            exit "$verify_status"
          fi
          node scripts/release-gates.js snapshot-latest \
            --tag "$TAG_VERSION" \
            --output dist/previous-latest.json \
            --persist
          promote_status=0
          node scripts/release-gates.js release-action \
            --action promote \
            --tag "$TAG_VERSION" \
            --target "$GITHUB_SHA" \
            --snapshot dist/previous-latest.json || promote_status=$?
          # A failed PATCH may have reached GitHub. Re-read authenticated state
          # first; recovery is authorized only when this candidate is observed
          # as latest. A CAS mismatch must remain a zero-mutation abort.
          node scripts/release-gates.js release-status \
            --tag "$TAG_VERSION" \
            > "$RUNNER_TEMP/release-status-after-promote.json"
          promotion_outcome=$(node scripts/release-gates.js promotion-outcome \
            --status-file "$RUNNER_TEMP/release-status-after-promote.json" \
            --promote-status "$promote_status" \
            --tag "$TAG_VERSION")
          if [ "$promotion_outcome" != "verify-latest" ]; then
            if [ "$promote_status" -ne 0 ]; then
              exit "$promote_status"
            fi
            echo "promotion completed without candidate becoming latest"
            exit 1
          fi
          # The candidate was observed latest, so anonymous verification may
          # reconcile a real post-PATCH failure and invoke bounded recovery.
          verify_status=0
          node scripts/release-gates.js verify-latest \
            --tag "$TAG_VERSION" \
            --artifact "dist/triss-coworker-${TAG_VERSION#v}-standalone.ndjson.gz" \
            --checksum "dist/triss-coworker-${TAG_VERSION#v}-standalone.sha256" \
            --manifest dist/update-manifest.json || verify_status=$?
          if [ "$verify_status" -eq 0 ]; then
            node scripts/release-gates.js clear-promotion-state --tag "$TAG_VERSION"
            exit 0
          fi
          recovery_status=0
          node scripts/release-gates.js recover-promotion \
            --tag "$TAG_VERSION" \
            --state dist/previous-latest.json \
            --load || recovery_status=$?
          if [ "$recovery_status" -ne 0 ]; then
            exit "$recovery_status"
          fi
          # Keep the workflow failed after a recovered incident so the
          # publication is not reported as a clean latest promotion.
          if [ "$promote_status" -ne 0 ]; then
            exit "$promote_status"
          fi
          exit "$verify_status"
