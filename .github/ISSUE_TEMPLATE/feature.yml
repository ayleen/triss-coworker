name: Feature request
description: Propose a scoped user-facing improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem cannot be solved with the current CLI?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data flow or security impact
      description: Note new network recipients, credentials, filesystem writes, or child processes.
